name: android-build

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create clean Android scaffold
        run: |
          rm -rf /tmp/meme_v1_mobile
          flutter create             --platforms=android             --org com.ohhamin             --project-name meme_v1             /tmp/meme_v1_mobile

          rm -rf /tmp/meme_v1_mobile/lib
          rm -rf /tmp/meme_v1_mobile/test
          cp -R mobile/lib /tmp/meme_v1_mobile/lib
          cp mobile/pubspec.yaml /tmp/meme_v1_mobile/pubspec.yaml

      - name: Install dependencies
        working-directory: /tmp/meme_v1_mobile
        run: flutter pub get

      - name: Analyze
        working-directory: /tmp/meme_v1_mobile
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        working-directory: /tmp/meme_v1_mobile
        run: |
          flutter build apk --debug             --dart-define=API_BASE_URL=http://127.0.0.1:8000             --dart-define=API_TOKEN=ci-placeholder-token

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meme-v1-debug-apk
          path: /tmp/meme_v1_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
